services:
  - type: web
    name: student-attendance
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PASSWORD_RESET_TOKEN
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
